name: action-s3-publish

author: Heron Labs

description: Sync a build folder to an S3 bucket (website-style publish with cache headers and intelligent tiering).

inputs:
  AWS_ROLE_TO_ASSUME:
    description: ARN of the IAM role to assume via OIDC.
    required: true
  AWS_REGION:
    description: AWS region where the S3 bucket lives.
    required: true
  AWS_ROLE_DURATION_SECONDS:
    description: Duration in seconds for the assumed role session.
    required: true
  BUILD_FOLDER:
    description: Local folder (relative to the repo root) whose contents should be published.
    required: true
  BUCKET_NAME:
    description: Destination S3 bucket name.
    required: true
  PUBLIC_ACL:
    description: Set to `"true"` to apply `public-read` ACL. Defaults to `private`.
    required: false

runs:
  using: composite
  steps:
    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
      with:
        aws-region: ${{ inputs.AWS_REGION }}
        role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        role-duration-seconds: ${{ inputs.AWS_ROLE_DURATION_SECONDS }}
        role-session-name: action-s3-publish-session

    - name: 'Publish statics to S3'
      shell: bash
      run: bash ${{ github.action_path }}/core/publish.sh
      env:
        BUILD_FOLDER: ${{ inputs.BUILD_FOLDER }}
        BUCKET_NAME: ${{ inputs.BUCKET_NAME }}
        PUBLIC_ACL: ${{ inputs.PUBLIC_ACL }}
