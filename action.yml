name: S3 Publish

author: Heron Labs

description: Sync a build folder to an S3 bucket (website-style publish with cache headers and intelligent tiering).

branding:
  icon: hard-drive
  color: green

inputs:
  AWS_ROLE_TO_ASSUME:
    description: ARN of the IAM role to assume via OIDC.
    required: true
  AWS_REGION:
    description: AWS region where the S3 bucket lives.
    required: true
  AWS_ROLE_DURATION_SECONDS:
    description: Duration in seconds for the assumed role session.
    required: true
  BUILD_FOLDER:
    description: Local folder (relative to the repo root) whose contents should be published.
    required: true
  BUCKET_NAME:
    description: Destination S3 bucket name.
    required: true
  PUBLIC_ACL:
    description: Set to `"true"` to apply `public-read` ACL. Defaults to `private`.
    required: false
  PRUNE_STALE:
    description: Set to `"false"` to keep previously published objects (skips the bucket wipe and `--delete`). Defaults to pruning.
    required: false
  NO_CACHE_HTML:
    description: Set to `"true"` to publish `*.html` with `cache-control no-cache` (everything else keeps the long-lived cache header). Defaults to one cache header for all files.
    required: false
  NO_CACHE_PATTERNS:
    description: Comma-separated `aws s3 sync` patterns, matched against paths relative to `BUILD_FOLDER`, published with `cache-control no-cache` (everything else keeps the long-lived cache header). Adds to `NO_CACHE_HTML`. Example `sw.js,manifest.webmanifest`.
    required: false

runs:
  using: composite
  steps:
    - name: 'Configure AWS Credentials'
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-region: ${{ inputs.AWS_REGION }}
        role-to-assume: ${{ inputs.AWS_ROLE_TO_ASSUME }}
        role-duration-seconds: ${{ inputs.AWS_ROLE_DURATION_SECONDS }}
        role-session-name: action-s3-publish-session

    - name: 'Publish to S3'
      shell: bash
      run: bash ${{ github.action_path }}/core/publish.sh
      env:
        BUILD_FOLDER: ${{ inputs.BUILD_FOLDER }}
        BUCKET_NAME: ${{ inputs.BUCKET_NAME }}
        PUBLIC_ACL: ${{ inputs.PUBLIC_ACL }}
        PRUNE_STALE: ${{ inputs.PRUNE_STALE }}
        NO_CACHE_HTML: ${{ inputs.NO_CACHE_HTML }}
        NO_CACHE_PATTERNS: ${{ inputs.NO_CACHE_PATTERNS }}
